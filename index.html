<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Solitaire Merge</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&display=swap" rel="stylesheet">
<style>
  :root { --page: #a89484; --shadow: rgba(60, 40, 25, .35); }
  @media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) { --page: #2e2621; --shadow: rgba(0,0,0,.5); } }
  :root[data-theme="dark"] { --page: #2e2621; --shadow: rgba(0,0,0,.5); }
  :root { box-sizing: border-box; padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px); }
  html, body { height: 100%; margin: 0; }
  body {
    background: var(--page); display: flex; align-items: center; justify-content: center;
    overflow: hidden; user-select: none; -webkit-user-select: none; -webkit-tap-highlight-color: transparent;
  }
  canvas { display: block; touch-action: none; border-radius: 22px; box-shadow: 0 12px 40px var(--shadow); }
</style>
</head>
<body>
<canvas id="c" aria-label="Solitaire Merge game"></canvas>
<script>
(() => {
'use strict';

// ---------- Ayarlar ----------
const CFG = {
  handSize: 3,      // altta verilen kart sayısı
  randGap: 2,       // gelen kartlar aktif hedeften en az 2 küçük (level'da "gap" ile ezilebilir)
  slotsPerRow: 4,   // bir satırda en fazla 4 slot
  lowBias: true,    // küçük kartlar biraz daha sık gelsin
  endless: { startTarget: 6, startSlots: 4, slotEvery: 3, maxSlots: 8 },  // Endless mod
  pairChance: 0.09,    // ikili deste (ör. 4-3) gelme ihtimali
  tripleChance: 0.03,  // üçlü deste (ör. 4-3-2) gelme ihtimali
  specialChance: 0.07  // açılmış özel kartlardan biri gelme ihtimali (her el en fazla 1)
};

// ---------- Leveller ----------
// targets : sırayla ulaşılacak hedefler (ardışık olmak zorunda değil)
// slots   : başlangıçta açık slot sayısı
// board   : açık slotlardaki başlangıç kartları, arkadan öne (ör. [3,2,1] -> 1 en önde)
// unlocks : (ops.) kilitli slotların hangi hedef tamamlanınca açılacağı. Varsayılan: son hedef hariç her hedefte 1 slot -> targets.slice(0, -1)
// gap     : (ops.) gelen kartların hedeften en az kaç küçük olacağı
const LEVELS = [
  { targets: [6],             slots: 4, board: [[1], [3], [4], []], hand: [1, 2, 3], tutorial: true },   // 1: tutorial
  { targets: [6, 7],          slots: 3, board: [[3, 2, 1], [], [4, 3, 1]] },
  { targets: [7, 8],          slots: 4, board: [[5, 3, 1], [], [4, 3, 2], []] },
  { targets: [7, 9],          slots: 3, board: [[5, 3, 5], [], [3, 2, 1]] },                 // 4: desteli kartlar
  { targets: [6, 8, 9],       slots: 3, board: [[4, 3, 1], [], [2]] },
  { targets: [7, 9, 12],      slots: 4, board: [[3, 2, 1], [4, 3, 1], [], [5, 3, 5]] },      // 6: Joker Merge
  { targets: [8, 10],         slots: 4, board: [[6, 5, 3], [], [4, 2, 1], []] },
  { targets: [8, 10, 11],     slots: 4, board: [[5, 4, 2], [6, 3, 1], [], []] },             // 8: Joker Sort
  { targets: [9, 11, 13],     slots: 4, board: [[7, 6, 5], [], [5, 3, 1], []] },
  { targets: [7, 10, 12, 14], slots: 4, board: [[3, 2, 1], [6, 4, 2], [], [5, 3, 5]] },      // 10: Upgrade
  { targets: [9, 12],         slots: 4, board: [[7, 5, 3], [6, 4], [], [2, 1]] },
  { targets: [10, 12, 13],    slots: 4, board: [[8, 6, 4], [], [7, 5, 2], [3]] },            // 12: Blast
  { targets: [9, 11, 14],     slots: 4, board: [[6, 4, 6], [], [5, 3, 1], []] },
  { targets: [10, 13, 15],    slots: 4, board: [[8, 7, 5], [4, 2, 1], [], [6, 3]] },         // 14: Downgrade
  { targets: [11, 13, 15],    slots: 4, board: [[9, 6, 3], [], [8, 5, 2], [7]] },
  { targets: [8, 11, 14, 16], slots: 4, board: [[5, 4, 3], [7, 5, 2], [], [6, 1]] }
];

// ---------- Level 1 tutorial ----------
// Her adımda yalnızca 'from' kaynağı 'to' slotuna sürüklenebilir; başka hamle yapılamaz
const TUT_STEPS = [
  { from: { type: 'hand', i: 0 }, to: 0, text: 'Drag the 1 onto the other 1' },
  { from: { type: 'slot', si: 0 }, to: 1, text: 'Drag the 2 onto the 3' },
  { from: { type: 'slot', si: 1 }, to: 2, text: 'Drag the 3-2 stack onto the 4' },
  { from: { type: 'hand', i: 1 }, to: 2, text: 'Drag the 2 onto the stack' }
];

// ---------- Özellikler / özel kartlar ----------
// level: hangi levelda açılır (1'den başlar), stage: Endless'ta hangi stage'de açılır
const FEATURES = [
  { id: 'stacks', level: 4,  stage: 3 },
  { id: 'jmerge', level: 6,  stage: 4 },
  { id: 'jsort',  level: 8,  stage: 6 },
  { id: 'up',     level: 10, stage: 8 },
  { id: 'blast',  level: 12, stage: 10 },
  { id: 'down',   level: 14, stage: 12 }
];
const SPECIAL_IDS = ['jmerge', 'jsort', 'up', 'blast', 'down'];
// Örnekler: a = taşınan, b = slottaki deste, r = sonuç (arkadan öne)
const SP = {
  jmerge: { name: 'Joker Merge', title: 'New card!', col: '#e9a91f', f: '#fde7a6', m: '#f7cf5c', dk: '#6b4f12',
    desc: 'Becomes the same value as the card it lands on, so the two merge.',
    ex: { a: ['jmerge'], b: [5, 3], r: [5, 4] } },
  jsort: { name: 'Joker Sort', title: 'New card!', col: '#2fb3c4', f: '#bff0f5', m: '#82dbe6', dk: '#145566',
    desc: 'Becomes one less than the card it lands on. It cannot go on a 1.',
    ex: { a: ['jsort'], b: [8], r: [8, 7] } },
  up: { name: 'Upgrade', title: 'New card!', col: '#4caf6a', f: '#cdeec0', m: '#8fd69a', dk: '#1d5a36',
    desc: 'Raises every card in the slot by 1, then disappears.',
    ex: { a: ['up'], b: [5, 3, 2], r: [6, 4, 3] } },
  blast: { name: 'Blast', title: 'New card!', col: '#ef7a2e', f: '#ffd6b0', m: '#ffb47a', dk: '#6e3613',
    desc: 'Blows up the slot and clears every card in it.',
    ex: { a: ['blast'], b: [6, 4, 2], r: [] } },
  down: { name: 'Downgrade', title: 'New card!', col: '#d9665a', f: '#fbc9c0', m: '#f39a8d', dk: '#6a2626',
    desc: 'Lowers every card in the slot by 1 and removes the 1s, then disappears.',
    ex: { a: ['down'], b: [4, 2, 1], r: [3, 1] } }
};

const LW = 540, LH = 960, RATIO = 1.36, HW = 92;
const FONT = '"Fredoka", "Trebuchet MS", "Segoe UI", system-ui, sans-serif';
const BOARD = { x: 16, y: 16, w: 508, h: 744 };
const TRAY  = { x: 16, y: 772, w: 508, h: 172 };
const TOG = { x: 22, y: 31, w: 150, h: 34 };
const BTNS = [{ x: 392, y: 54, id: 'help' }, { x: 440, y: 54, id: 'sound' }, { x: 488, y: 54, id: 'restart' }];
const CHEAT = { x: 270, y: 108, r: 15 };
const INTRO_BTN = { x: 170, y: 676, w: 200, h: 60 };
const NAV = { prev: { x: 0, y: 48, r: 16 }, next: { x: 0, y: 48, r: 16 } };
const HELP_BTN = { x: 170, y: 736, w: 200, h: 60 };
const END_BTN = { x: 160, y: 486, w: 220, h: 64 };

const PALETTE = [null,
  { f: '#f9b8ac', b: '#e97f6f', t: '#df5f4e' }, // 1
  { f: '#f9cba6', b: '#e9955c', t: '#d6773a' }, // 2
  { f: '#fbe3a2', b: '#e5b54a', t: '#cf961f' }, // 3
  { f: '#eff4a6', b: '#bdca3e', t: '#9ead1c' }, // 4
  { f: '#d5f1a8', b: '#8ecb4e', t: '#67ab2c' }, // 5
  { f: '#bdedc8', b: '#5cbf7c', t: '#36a159' }, // 6
  { f: '#b6ecf3', b: '#4dbfd0', t: '#1f9fb2' }, // 7
  { f: '#bfd5fb', b: '#5f90e5', t: '#3d6fcb' }, // 8
  { f: '#d5c7fa', b: '#9479e3', t: '#7357cb' }, // 9
  { f: '#f5c4ec', b: '#d372c3', t: '#b64fa6' }, // 10
  { f: '#ffc5d1', b: '#e76886', t: '#c94566' }, // 11
  { f: '#e8d4b6', b: '#b08b54', t: '#8d6935' }  // 12
];
const pal = v => v < PALETTE.length ? PALETTE[v]
  : { f: `hsl(${v * 47 % 360} 80% 86%)`, b: `hsl(${v * 47 % 360} 55% 56%)`, t: `hsl(${v * 47 % 360} 55% 42%)` };

// ---------- Kalıcı veri ----------
const store = {
  get(k, d) { try { const v = localStorage.getItem(k); return v === null ? d : v; } catch (e) { return d; } },
  set(k, v) { try { localStorage.setItem(k, v); } catch (e) {} }
};
let muted = store.get('sm_mute', '0') === '1';
const seen = store.get('sm_seen', '0') === '1';
let helpClicked = store.get('sm_help_clicked', '0') === '1';   // help butonuna bir kez basıldıysa sinyal bir daha yanmaz
const E = CFG.endless;
let bestCard = +store.get('sm_best_card', 0) || 0;   // Endless score: ulaşılan en büyük kart

// ---------- Canvas ----------
const cvs = document.getElementById('c');
const ctx = cvs.getContext('2d');
let scale = 1;
function resize() {
  const r = document.body.getBoundingClientRect();
  let w = r.width, h = r.height;
  if (w / h > 9 / 16) w = h * 9 / 16; else h = w * 16 / 9;
  const dpr = Math.min(window.devicePixelRatio || 1, 3);
  cvs.style.width = w + 'px'; cvs.style.height = h + 'px';
  cvs.width = Math.round(w * dpr); cvs.height = Math.round(h * dpr);
  scale = cvs.width / LW;
}
window.addEventListener('resize', resize);
resize();

function rr(x, y, w, h, r) {
  r = Math.min(r, w / 2, h / 2);
  ctx.beginPath();
  ctx.moveTo(x + r, y);
  ctx.arcTo(x + w, y, x + w, y + h, r);
  ctx.arcTo(x + w, y + h, x, y + h, r);
  ctx.arcTo(x, y + h, x, y, r);
  ctx.arcTo(x, y, x + w, y, r);
  ctx.closePath();
}

// ---------- Ses ----------
let AC = null;
function initAudio() {
  if (!AC) { try { AC = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) {} }
  if (AC && AC.state === 'suspended') AC.resume();
}
function tone(f, dur, type = 'sine', vol = 0.12, delay = 0) {
  if (!AC || muted) return;
  const t = AC.currentTime + delay, o = AC.createOscillator(), g = AC.createGain();
  o.type = type; o.frequency.setValueAtTime(f, t);
  g.gain.setValueAtTime(0.0001, t);
  g.gain.exponentialRampToValueAtTime(vol, t + 0.01);
  g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
  o.connect(g).connect(AC.destination); o.start(t); o.stop(t + dur + 0.03);
}
function sfx(k, n = 1) {
  switch (k) {
    case 'place': tone(330, 0.07, 'triangle', 0.1); break;
    case 'tick': tone(700, 0.04, 'sine', 0.06); break;
    case 'deal': [0, 1, 2].forEach(i => tone(560 + i * 60, 0.05, 'sine', 0.05, i * 0.06)); break;
    case 'merge': {
      const f = 392 * Math.pow(2, (n - 1) * 3 / 12);
      tone(f, 0.18, 'triangle', 0.15); tone(f * 2, 0.12, 'sine', 0.05, 0.02); break;
    }
    case 'stage': [0, 4, 7, 12].forEach((s, i) => tone(523 * Math.pow(2, s / 12), 0.22, 'triangle', 0.13, i * 0.08)); break;
    case 'win': [0, 4, 7, 12, 16, 19, 24].forEach((s, i) => tone(523 * Math.pow(2, s / 12), 0.28, 'triangle', 0.13, i * 0.07)); break;
    case 'unlock': tone(880, 0.12, 'sine', 0.08); tone(1320, 0.16, 'sine', 0.06, 0.06); break;
    case 'bad': tone(140, 0.12, 'square', 0.04); break;
    case 'blast': [0, 1, 2].forEach(i => tone(110 - i * 20, 0.25, 'sawtooth', 0.07, i * 0.04)); tone(60, 0.4, 'square', 0.05); break;
    case 'down': [0, -3, -6].forEach((s, i) => tone(520 * Math.pow(2, s / 12), 0.12, 'triangle', 0.1, i * 0.05)); break;
    case 'joker': tone(660, 0.08, 'sine', 0.08); tone(990, 0.12, 'triangle', 0.08, 0.05); break;
    case 'fail': [0, -3, -7].forEach((s, i) => tone(330 * Math.pow(2, s / 12), 0.32, 'sine', 0.12, i * 0.16)); break;
  }
}
const vib = p => { try { navigator.vibrate && navigator.vibrate(p); } catch (e) {} };

// ---------- Durum ----------
let S, uid = 0, drag = null, parts = [], texts = [];
const sleep = ms => new Promise(r => setTimeout(r, ms));

function mkCard(v, x, y) {
  return { id: uid++, v, x, y, w: HW, pop: 0, shake: 0, lift: 0, alpha: 1, ov: null, drag: false, sel: false };
}
function mkSpecial(kind, x, y) { const c = mkCard(0, x, y); c.kind = kind; return c; }
const gapOf = lv => lv.gap == null ? CFG.randGap : lv.gap;
function featOn(id) {
  const f = FEATURES.find(x => x.id === id);
  return S.mode === 'level' ? S.li + 1 >= f.level : S.stage >= f.stage;
}

function loadLevel(i, hint = true) {   // hint: help butonu dikkat çeksin
  i = Math.max(0, Math.min(LEVELS.length - 1, i));
  store.set('sm_level', i); store.set('sm_mode', 'level');
  const lv = LEVELS[i], unlocks = lv.unlocks || lv.targets.slice(0, -1);
  S = {
    mode: 'level', li: i, lv, slots: [], locked: [], unpop: [], hand: [], ti: 0, maxCard: 0, mpop: 0,
    target: lv.targets[0], maxRand: Math.max(1, lv.targets[0] - gapOf(lv)),
    prog: 0, busy: false, end: null, endT: 0, sel: null, banner: null, tpop: 0, help: false, hint: hint && !helpClicked,
    fly: [], ghosts: [], intro: null, pendingSpecial: null
  };
  S.tut = lv.tutorial ? 0 : null; S.fixedHand = lv.hand || null;
  const feat = FEATURES.find(f => f.level === i + 1);   // bu levelda açılan özellik
  if (feat) {
    if (feat.id === 'stacks') S.pendingStack = true;          // desteler sessizce gelir; level başında 1 adet
    else { S.pendingSpecial = feat.id; if (hint) S.intro = feat.id; }   // özel kart: tanıtım + altta 1 adet
  }
  for (let si = 0; si < lv.slots; si++) {
    S.slots.push((lv.board[si] || []).map(v => mkCard(v, 0, 0)));
    S.locked.push(0); S.unpop.push(0);
  }
  unlocks.forEach(u => { S.slots.push([]); S.locked.push(u); S.unpop.push(0); });
  const L = layout();
  S.slots.forEach((st, si) => {
    const off = stackOff(L, si, st.length);
    st.forEach((c, j) => { c.x = L.xs[si]; c.y = stackY(L, si, j, off) - 40 - j * 12; c.w = L.cw; });
  });
  drag = null; parts = []; texts = [];
  deal();
}
// Endless: level eklenmeden önceki session modu
function loadEndless(hint = true) {
  store.set('sm_mode', 'endless');
  S = {
    mode: 'endless', li: 0, lv: null, slots: [], locked: [], unpop: [], hand: [], ti: 0, stage: 1, maxCard: 0, mpop: 0,
    target: E.startTarget, maxRand: Math.max(1, E.startTarget - CFG.randGap),
    prog: 0, busy: false, end: null, endT: 0, sel: null, banner: null, tpop: 0, help: false, hint: hint && !helpClicked,
    fly: [], ghosts: [], intro: null, pendingSpecial: null
  };
  for (let i = 0; i < E.startSlots; i++) { S.slots.push([]); S.locked.push(0); S.unpop.push(0); }
  drag = null; parts = []; texts = [];
  deal();
}
function restart() { S.mode === 'endless' ? loadEndless(false) : loadLevel(S.li, false); }
function bumpMax(v) {
  if (v > S.maxCard) S.maxCard = v;
  if (S.mode === 'endless' && v > bestCard) { bestCard = v; S.mpop = 1; store.set('sm_best_card', v); }
}
function endlessStageUp() {
  S.stage++; S.target++; S.maxRand++; S.tpop = 1;
  let sub = 'Cards now 1–' + S.maxRand;
  if ((S.stage - 1) % E.slotEvery === 0 && S.slots.length < E.maxSlots) {
    S.slots.push([]); S.locked.push(0); S.unpop.push(1); sub = '+1 slot unlocked'; sfx('unlock');
  }
  S.banner = { text: 'Stage ' + S.stage, sub, t: 0 };
  sfx('stage'); vib([20, 40, 20]);
  const f = FEATURES.find(x => x.stage === S.stage);   // Endless'ta özellik açılışı
  if (f) {
    if (f.id !== 'stacks') {   // desteler tanıtılmadan havuza girer
      S.intro = f.id;
      const e = S.hand.findIndex(it => !it);
      if (e >= 0) { const p = handCardPos(e, 0, 1); S.hand[e] = { cards: [mkSpecial(f.id, p.x, LH + 40)] }; }
      else S.pendingSpecial = f.id;
    }
  }
}
function randVal() {
  const m = S.maxRand, w = [];
  let tot = 0;
  for (let v = 1; v <= m; v++) { const x = CFG.lowBias ? (m - v + 3) : 1; w.push(x); tot += x; }
  let r = Math.random() * tot;
  for (let v = 1; v <= m; v++) { r -= w[v - 1]; if (r <= 0) return v; }
  return m;
}
// Havuzdan bir el öğesi: tek kart, ikili/üçlü deste ya da özel kart
function genItem(allowSpecial) {
  const specials = SPECIAL_IDS.filter(featOn);
  if (allowSpecial && specials.length && Math.random() < CFG.specialChance)
    return { cards: [mkSpecial(specials[Math.floor(Math.random() * specials.length)], 0, 0)] };
  let n = 1;
  if (featOn('stacks')) {
    const r = Math.random();
    n = r < CFG.tripleChance ? 3 : r < CFG.tripleChance + CFG.pairChance ? 2 : 1;
    n = Math.min(n, S.maxRand);
  }
  let v = randVal();
  if (v < n) v = n + Math.floor(Math.random() * (S.maxRand - n + 1));
  return { cards: Array.from({ length: n }, (_, j) => mkCard(v - j, 0, 0)) };   // arkadan öne: 4-3-2
}
function deal() {
  if (S.fixedHand) {   // tutorial eli
    S.fixedHand.forEach((v, i) => { const p = handCardPos(i, 0, 1); S.hand[i] = { cards: [mkCard(v, p.x, LH + 40 + i * 70)] }; });
    S.fixedHand = null; sfx('deal'); return;
  }
  let specialUsed = false;
  for (let i = 0; i < CFG.handSize; i++) {
    let it;
    if (S.pendingSpecial && i === 1) { it = { cards: [mkSpecial(S.pendingSpecial, 0, 0)] }; S.pendingSpecial = null; specialUsed = true; }
    else if (S.pendingStack && i === 1) {
      const v = Math.max(2, randVal()); it = { cards: [mkCard(v, 0, 0), mkCard(v - 1, 0, 0)] }; S.pendingStack = false;
    }
    else { it = genItem(!specialUsed); if (it.cards[0].kind) specialUsed = true; }
    it.cards.forEach((c, j) => { const p = handCardPos(i, j, it.cards.length); c.x = p.x; c.y = LH + 40 + i * 70 + (p.y - handCardPos(i, 0, it.cards.length).y); c.w = p.w; });
    S.hand[i] = it;
  }
  if (S.pendingSpecial) { S.hand[1] = { cards: [mkSpecial(S.pendingSpecial, handPos(1).x, LH + 40)] }; S.pendingSpecial = null; }
  sfx('deal');
}

// ---------- Yerleşim ----------
function layout() {
  const n = S.slots.length, per = CFG.slotsPerRow, rows = Math.ceil(n / per);
  const cols = Math.min(n, per), gap = 16, avail = BOARD.w - 32;
  const top = BOARD.y + 175, bottom = BOARD.y + BOARD.h - 22;
  const rowH = (bottom - top) / rows;
  let cw = Math.min(100, (avail - gap * (cols - 1)) / cols);
  if (rows > 1) cw = Math.min(cw, 86);
  const ch = cw * RATIO, xs = [], ys = [], lim = [], row = [];
  const y1 = rows === 1 ? top + (bottom - top - ch) / 2 : top;   // tek satırda dikeyde ortala
  for (let i = 0; i < n; i++) {
    const r = Math.floor(i / per), inRow = Math.min(per, n - r * per);
    const total = cw * inRow + gap * (inRow - 1), x0 = BOARD.x + (BOARD.w - total) / 2;
    xs.push(x0 + (i % per) * (cw + gap));
    ys.push(rows === 1 ? y1 : top + r * rowH);
    lim.push(r < rows - 1 ? top + (r + 1) * rowH - 18 : bottom);
    row.push(r);
  }
  return { n, rows, gap, cw, ch, xs, ys, lim, row };
}
// Ardışık olmayan iki kartın arası (ör. 7 ile arkasındaki 2) diğerlerinden daha açık
const BREAK = 0.6;   // ekstra aralık, normal aralığın katı
const isBreak = (st, i) => i > 0 && i < st.length && st[i].v !== st[i - 1].v - 1;
function stackOff(L, si, len) {
  const base = L.cw * 0.34, st = S.slots[si];
  let units = Math.max(0, len - 1);
  for (let i = 1; i < len; i++) if (isBreak(st, i)) units += BREAK;
  if (units <= 0) return base;
  const room = L.lim[si] - L.ys[si] - L.ch;
  return Math.max(8, Math.min(base, room / units));
}
function stackY(L, si, i, off) {
  const st = S.slots[si];
  let y = L.ys[si];
  for (let k = 1; k <= i; k++) y += off * (1 + (isBreak(st, k) ? BREAK : 0));
  return y;
}

// Fail kontrolü: eldeki kartlardan biri şimdi ya da board'daki taşımalarla (merge'ler dahil) yerleşebiliyor mu?

  const fits = (sl, h) => sl.some(st => {
    const top = st[st.length - 1];
    if (h.kind) return st.length > 0 && (h.kind !== 'jsort' || top > 1);
    return !st.length || top === h.v || top === h.v + 1;
  });

  const start = S.slots.filter((_, si) => !S.locked[si]).map(st => st.map(c => c.v));
  const seenS = new Set([key(start)]), q = [start];
  while (q.length) {
    if (seenS.size > 5000) return true;
    const sl = q.shift();

      const st = sl[si];
      if (!st.length) continue;

    const st = S.slots[c.flySi], off = stackOff(L, c.flySi, st.length);
    approach(c, L.xs[c.flySi], stackY(L, c.flySi, Math.max(0, st.length - 1), off) + 10, L.cw, kf);
  });

  if (active && !S.busy && !S.end) {
    let hov = -1;
    if (drag && drag.moved) { const c0 = drag.cards[0]; hov = slotAt(c0.x + c0.w / 2, c0.y + c0.w * 0.5); }
    for (let si = 0; si < L.n; si++) {
      if (!legal(active, si)) continue;
      const st = S.slots[si], off = stackOff(L, si, st.length);
      glow(L.xs[si], stackY(L, si, Math.max(0, st.length - 1), off), L.cw, L.ch, si === hov);
    }
  }

  const late = [];
  S.slots.forEach(st => {
    if (st.some(c => c.lift > 0)) late.push(st);
    else st.forEach(c => { if (!c.drag) drawCard(c); });
  });
  late.forEach(st => st.forEach(c => { if (!c.drag) drawCard(c); }));
  S.hand.forEach(it => it && it.cards.forEach(c => { if (!c.drag) drawCard(c); }));
  S.fly.forEach(drawCard);
  S.ghosts.forEach(drawCard);
  if (drag) drag.cards.forEach(drawCard);

  parts.forEach(p => {
    ctx.globalAlpha = Math.max(0, p.life / p.max);
    ctx.fillStyle = p.c; ctx.beginPath(); ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2); ctx.fill();
  });
  ctx.globalAlpha = 1;
  texts.forEach(t => {
    ctx.globalAlpha = Math.max(0, Math.min(1, t.life * 1.5));
    ctx.font = `700 ${t.size}px ${FONT}`; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.lineWidth = 6; ctx.lineJoin = 'round'; ctx.strokeStyle = '#fff'; ctx.strokeText(t.text, t.x, t.y);
    ctx.fillStyle = t.color; ctx.fillText(t.text, t.x, t.y);
  });
  ctx.globalAlpha = 1;
  if (tutStep() && !S.end) drawTutorialGuide();

  if (S.banner) {
    const t = S.banner.t;
    const a = t < 0.12 ? t / 0.12 : t > 1.3 ? Math.max(0, (1.6 - t) / 0.3) : 1;
    const sc = t < 0.22 ? 0.6 + 0.4 * easeOutBack(t / 0.22) : 1;
    const p = pal(S.target);
    ctx.save(); ctx.globalAlpha = a; ctx.translate(LW / 2, BOARD.y + BOARD.h - 90); ctx.scale(sc, sc);
    rr(-170, -46, 340, 92, 28); ctx.fillStyle = 'rgba(255,255,255,0.94)'; ctx.fill();
    ctx.lineWidth = 4; ctx.strokeStyle = p.b; ctx.stroke();
    text(S.banner.text, 0, -12, 30, '#7a5a3c', 700);
    text(S.banner.sub, 0, 22, 18, p.t, 600);
    ctx.restore();
  }

  if (S.help) drawHelp();
  if (S.intro) drawIntro();
  if (S.end) drawEnd();
}
// Help: kuralları mini kart illüstrasyonlarıyla gösterir. Desteler arkadan öne yazılır (ör. [3, 2] -> 2 önde).
const HELP_ROWS = [
  { cap: 'Two equal cards merge into the next one', a: [2], b: [2], r: [3] },
  { cap: 'A card stacks on a card one higher', a: [2], b: [3], r: [3, 2] },
  { cap: 'Stacks can go on stacks', a: [3, 2], b: [6, 5, 4], r: [6, 5, 4, 3, 2] },
  { cap: 'Stacks merge too', a: [3, 2], b: [3], r: [4, 2] }
];
const HC = { w: 40, off: 15 };
function stackH(n) { return HC.w * RATIO + (n - 1) * HC.off; }
function miniCard(v, x, y, alpha = 1) {
  const c = { x, y, w: HC.w, v, pop: 0, shake: 0, mini: true, peek: true, alpha };
  if (typeof v === 'string') { c.kind = v; c.v = 0; }
  drawCard(c);
}
function miniStack(vals, x, y) {
  if (!vals.length) { rr(x, y, HC.w, HC.w * RATIO, HC.w * 0.16); ctx.fillStyle = '#f2e4d4'; ctx.fill(); return; }
  vals.forEach((v, i) => miniCard(v, x, y + i * HC.off));
}
function opSign(kind, cx, cy) {
  ctx.save(); ctx.strokeStyle = '#c2a483'; ctx.lineWidth = 4; ctx.lineCap = 'round'; ctx.lineJoin = 'round'; ctx.beginPath();
  if (kind === '+') { ctx.moveTo(cx - 8, cy); ctx.lineTo(cx + 8, cy); ctx.moveTo(cx, cy - 8); ctx.lineTo(cx, cy + 8); }
  else { ctx.moveTo(cx - 11, cy); ctx.lineTo(cx + 11, cy); ctx.moveTo(cx + 4, cy - 7); ctx.lineTo(cx + 11, cy); ctx.lineTo(cx + 4, cy + 7); }
  ctx.stroke(); ctx.restore();
}
// Taşıma ipucu: soldaki deste kavis çizerek sağdakinin önüne gider (kesikli ok + hareket eden hayalet deste)
function moveHint(row, ax, bx, top, k) {
  const sx = ax + HC.w / 2, sy = top - 4;
  const ex = bx + HC.w / 2, ey = top + (row.b.length - 1) * HC.off - 4;
  const cx = (sx + ex) / 2, cy = Math.min(sy, ey) - 34;
  ctx.save();
  ctx.strokeStyle = '#c2a483'; ctx.lineWidth = 3; ctx.lineCap = 'round'; ctx.setLineDash([5, 6]);
  ctx.beginPath(); ctx.moveTo(sx, sy); ctx.quadraticCurveTo(cx, cy, ex, ey - 6); ctx.stroke();
  ctx.setLineDash([]);
  const ang = Math.atan2(ey - 6 - cy, ex - cx);
  ctx.beginPath();
  ctx.moveTo(ex + Math.cos(ang - 2.5) * 9, ey - 6 + Math.sin(ang - 2.5) * 9);
  ctx.lineTo(ex, ey - 6);
  ctx.lineTo(ex + Math.cos(ang + 2.5) * 9, ey - 6 + Math.sin(ang + 2.5) * 9);
  ctx.stroke();
  ctx.restore();
  // hayalet: deste yay boyunca kayıp sağdakinin önüne oturur
  const t = ((performance.now() / 1700) + k * 0.18) % 1;
  if (t < 0.75) {
    const u = Math.min(1, t / 0.6), e = u * u * (3 - 2 * u);
    const lx = bx, ly = top + row.b.length * HC.off;           // inişte arka kartın konumu
    const qx = (ax + lx) / 2, qy = Math.min(top, ly) - 40;
    const gx = (1 - e) * (1 - e) * ax + 2 * (1 - e) * e * qx + e * e * lx;
    const gy = (1 - e) * (1 - e) * top + 2 * (1 - e) * e * qy + e * e * ly;
    const alpha = 0.55 * Math.min(1, t / 0.08) * (t > 0.6 ? Math.max(0, (0.75 - t) / 0.15) : 1);
    row.a.forEach((v, i) => miniCard(v, gx, gy + i * HC.off, alpha));
  }
}
function drawHelp() {
  ctx.fillStyle = 'rgba(70,48,32,0.45)'; ctx.fillRect(0, 0, LW, LH);
  rr(36, 72, 468, 752, 30); ctx.fillStyle = '#fbf4ec'; ctx.fill();
  text('Tutorial', LW / 2, 120, 30, '#7a5a3c', 700);
  ctx.beginPath(); ctx.arc(462, 112, 19, 0, Math.PI * 2); ctx.fillStyle = '#f1e1cd'; ctx.fill();   // bilgi ekranı işareti
  text('?', 462, 113, 20, '#9a7a5a', 700);
  let y = 172;
  HELP_ROWS.forEach((row, k) => {
    if (k) { ctx.fillStyle = '#efe2d2'; ctx.fillRect(70, y - 10, 400, 2); }
    text(row.cap, LW / 2, y + 10, 17, '#7a5f48', 600);
    const top = y + 46, hMax = Math.max(stackH(row.a.length), stackH(row.b.length), stackH(row.r.length));
    const total = HC.w * 3 + 40 * 2 + 16, x0 = LW / 2 - total / 2, mid = top + HC.w * RATIO / 2;
    exampleRow(row, x0, top, mid, k);
    y = top + hMax + 16;
  });
  const b = HELP_BTN;
  rr(b.x, b.y, b.w, b.h, 30); ctx.fillStyle = '#5cbf7c'; ctx.fill();
  text('Play', b.x + b.w / 2, b.y + b.h / 2 + 1, 24, '#fff', 700);
}
function exampleRow(row, x0, top, mid, k) {
  miniStack(row.a, x0, top);
  miniStack(row.b, x0 + HC.w + 40, top);
  moveHint(row, x0, x0 + HC.w + 40, top, k);
  opSign('>', x0 + HC.w * 2 + 68, mid);
  miniStack(row.r, x0 + HC.w * 2 + 56 + 40, top);
}
// Yeni özellik / kart tanıtımı
function drawIntro() {
  const sp = SP[S.intro];
  ctx.fillStyle = 'rgba(70,48,32,0.5)'; ctx.fillRect(0, 0, LW, LH);
  rr(36, 150, 468, 616, 30); ctx.fillStyle = '#fbf4ec'; ctx.fill();
  text(sp.title, LW / 2, 196, 30, '#7a5a3c', 700);
  const t = performance.now() / 1000, bw = 96;
  drawCard({ x: LW / 2 - bw / 2, y: 236 + Math.sin(t * 2) * 4, w: bw, v: 0, kind: S.intro, pop: 0, shake: 0, rot: Math.sin(t * 1.5) * 0.05 });
  text(sp.name, LW / 2, 412, 26, '#7a5a3c', 700);
  ctx.font = `500 18px ${FONT}`; ctx.fillStyle = '#8a6f56'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  wrap(sp.desc, LW / 2, 450, 380, 25);
  const ex = sp.ex, total = HC.w * 3 + 40 * 2 + 16, x0 = LW / 2 - total / 2, top = 548;
  exampleRow(ex, x0, top, top + HC.w * RATIO / 2, 0);
  const b = INTRO_BTN;
  rr(b.x, b.y, b.w, b.h, 30); ctx.fillStyle = '#5cbf7c'; ctx.fill();
  text('Got it', b.x + b.w / 2, b.y + b.h / 2 + 1, 24, '#fff', 700);
}
function drawEnd() {
  const a = S.endT, win = S.end === 'win';
  ctx.globalAlpha = a;
  ctx.fillStyle = 'rgba(70,48,32,0.5)'; ctx.fillRect(0, 0, LW, LH);
  ctx.save(); ctx.translate(LW / 2, 460); const sc = 0.85 + 0.15 * easeOutBack(a); ctx.scale(sc, sc); ctx.translate(-LW / 2, -460);
  rr(70, 330, 400, 260, 30); ctx.fillStyle = '#fbf4ec'; ctx.fill();
  if (win) {
    text('Level ' + (S.li + 1) + ' complete!', LW / 2, 388, 32, '#7a5a3c', 700);
    text(S.lv.targets.length > 1 ? 'All targets reached.' : 'Target reached.', LW / 2, 432, 17, '#a3866a', 500);
  } else {
    text('No moves left', LW / 2, 388, 32, '#7a5a3c', 700);
    text(S.mode === 'endless' ? 'Stage ' + S.stage + '   ·   Score ' + S.maxCard + '   ·   Best ' + bestCard : 'No card fits, even after moving stacks.',
      LW / 2, 432, S.mode === 'endless' ? 18 : 16, '#a3866a', 500);
  }
  const b = END_BTN, last = S.li >= LEVELS.length - 1;
  rr(b.x, b.y, b.w, b.h, 32); ctx.fillStyle = '#5cbf7c'; ctx.fill();
  text(win ? (last ? 'Back to level 1' : 'Next level') : 'Retry', b.x + b.w / 2, b.y + b.h / 2 + 1, 24, '#fff', 700);
  ctx.restore();
  ctx.globalAlpha = 1;
}

// ---------- Başlat ----------
if (store.get('sm_mode', 'level') === 'endless') loadEndless();
else loadLevel(+store.get('sm_level', 0) || 0);
let lastT = performance.now();
function frame(t) {
  const dt = Math.min(0.05, (t - lastT) / 1000); lastT = t;
  update(dt); draw();
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
})();
</script>
